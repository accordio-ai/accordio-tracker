<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://app.accordio.ai wss://app.accordio.ai https://*.ingest.de.sentry.io; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Accordio AI</title>
    <style>
      /* No universal margin/padding reset here — Tailwind preflight already does
         it inside @layer base. An unlayered copy outranks every spacing utility
         (unlayered beats layered), which zeroes all p-*/m-* in the chat UI. */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        overflow: hidden;
        background: transparent;
      }
      #root {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
